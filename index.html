<style>
#net-gate{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#6C5CE733 0%,transparent 60%),#0F1115;font-family:Manrope,system-ui,sans-serif;color:#EDEEF2;}
#net-gate .ng-card{width:100%;max-width:360px;text-align:center;padding:36px 26px 28px;border-radius:24px;background:rgba(23,26,33,.85);border:1px solid #2A2F3A;box-shadow:0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#net-gate .ng-icon{position:relative;width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#6C5CE71f;color:#A99BFF;}
#net-gate .ng-icon:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #6C5CE766;animation:ngPulse 2s ease-out infinite;}
#net-gate .ng-title{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin-bottom:10px;}
#net-gate .ng-text{font-size:14.5px;line-height:1.55;color:#9BA1AF;margin-bottom:26px;}
#net-gate .ng-btn{width:100%;height:50px;border:0;border-radius:14px;font:700 15px Manrope,sans-serif;color:#fff;background:linear-gradient(135deg,#6C5CE7,#8A7CFF);box-shadow:0 10px 26px #6C5CE748;cursor:pointer;}
#net-gate .ng-btn:disabled{opacity:.6;cursor:default;}
#net-gate .ng-msg{min-height:18px;margin-top:12px;font-size:12.5px;color:#5C6270;}
@keyframes ngPulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion: reduce){#net-gate .ng-icon:before{animation:none;}}
</style>
</head>

<div id="net-gate" role="alertdialog" aria-live="assertive">
  <div class="ng-card">
    <div class="ng-icon"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.4a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/><path d="M3 3l18 18"/></svg></div>

    <div class="ng-text">Проверьте Wi‑Fi или мобильные данные. Как только связь появится, Dropplay откроется сам.</div>
    <button id="net-retry" class="ng-btn" type="button">Повторить</button>
    <div id="net-msg" class="ng-msg"></div>
  </div>
</div>
<script>
(function(){
  var gate = document.getElementById('net-gate');
  var btn = document.getElementById('net-retry');
  var msg = document.getElementById('net-msg');
  var blocked = ['shell', 'toast-root', 'modal-root'];
  var state = null, busy = false;
  function show(ok){
    if(ok === state) return;
    state = ok;
    gate.style.display = ok ? 'none' : 'flex';
    blocked.forEach(function(id){ var el = document.getElementById(id); if(el) el.inert = !ok; });
    if(!ok) btn.focus();
  }
  function probe(){
    if(busy) return;
    if(navigator.onLine === false){ msg.textContent = 'Соединения нет'; show(false); return; }
    busy = true; btn.disabled = true; msg.textContent = 'Проверяем соединение…';
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var t = setTimeout(function(){ if(ctl) ctl.abort(); }, 6000);
    fetch(location.pathname + '?net=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function(r){ return r.status < 500; })
      .catch(function(){ return false; })
      .then(function(ok){
        clearTimeout(t); busy = false; btn.disabled = false;
        msg.textContent = ok ? '' : 'Связи пока нет';
        show(ok);
      });
  }
  btn.addEventListener('click', probe);
  window.addEventListener('online', probe);
  window.addEventListener('offline', function(){ show(false); });
  setInterval(probe, 15000);
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', probe);
  else probe();
})();
</script>
