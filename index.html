<script>
/* тема применяется до отрисовки, чтобы не мигала белая страница у тех, кто выбрал тёмную */
(function(){
  try{
    if(localStorage.getItem('dp_theme') === 'dark'){
      document.documentElement.setAttribute('data-theme','dark');

<style>
#net-gate{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#6C5CE71f 0%,transparent 60%),var(--bg);font-family:Manrope,system-ui,sans-serif;color:var(--text);}
#net-gate .ng-card{width:100%;max-width:360px;text-align:center;padding:36px 26px 28px;border-radius:24px;background:var(--surface);border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#net-gate .ng-icon{position:relative;width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#6C5CE71f;color:#A99BFF;}
#net-gate .ng-icon:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #6C5CE766;animation:ngPulse 2s ease-out infinite;}
#net-gate .ng-title{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin-bottom:10px;}
#net-gate .ng-text{font-size:14.5px;line-height:1.55;color:var(--text-dim);margin-bottom:26px;}
#net-gate .ng-btn{width:100%;height:50px;border:0;border-radius:14px;font:700 15px Manrope,sans-serif;color:#fff;background:linear-gradient(135deg,#6C5CE7,#8A7CFF);box-shadow:0 10px 26px #6C5CE748;cursor:pointer;}
#net-gate .ng-btn:disabled{opacity:.6;cursor:default;}
#net-gate .ng-msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--text-faint);}
@keyframes ngPulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion: reduce){#net-gate .ng-icon:before{animation:none;}}
#boot-veil{position:fixed;inset:0;z-index:2147483600;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#boot-veil.on{display:flex;}
#boot-veil .bv-spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--border);border-top-color:#6C5CE7;animation:bvSpin .9s linear infinite;}
@keyframes bvSpin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){#boot-veil .bv-spin{animation-duration:3s;}}
</style>
</head>

<div id="boot-veil" role="status" aria-label="Загрузка аккаунта"><div class="bv-spin"></div></div>
<script>
/* если вход сохранён, показываем размытый экран до восстановления аккаунта (гостевой экран не мелькает) */
(function(){
  var veil = document.getElementById('boot-veil');
  var has = false; try{ has = !!localStorage.getItem('dp_token'); }catch(e){}
  if(!has) return;
  veil.classList.add('on');
  var done = false;
  window.__hideBootVeil = function(){ if(done) return; done = true; veil.classList.remove('on'); };
  setTimeout(window.__hideBootVeil, 10000); /* запасной выход, если связь зависла */
})();
</script>

  <div class="ng-card">

<script>
(function(){
  var gate = document.getElementById('net-gate');
  var btn = document.getElementById('net-retry');
  var msg = document.getElementById('net-msg');
  var blocked = ['shell', 'toast-root', 'modal-root'];
  var state = null, busy = false, wasOff = false;
  /* старое локальное сохранение игрока больше не нужно: данные только на сервере */
  try{ localStorage.removeItem('obmenka_state_v4'); }catch(e){}
  function clearScreen(){
    var shell = document.getElementById('shell');
    if(shell) shell.style.visibility = 'hidden';
    ['app', 'bottomNav', 'toast-root', 'modal-root'].forEach(function(id){
      var el = document.getElementById(id); if(el) el.innerHTML = '';
    });
  }
  function show(ok){
    if(ok === state) return;
    state = ok;
    gate.style.display = ok ? 'none' : 'flex';
    blocked.forEach(function(id){ var el = document.getElementById(id); if(el) el.inert = !ok; });
    if(!ok){ wasOff = true; clearScreen(); btn.focus(); }
    else if(wasOff){ location.reload(); }   /* связь вернулась: страница грузится заново с сервера */
  }
  function probe(){
    if(busy) return;
    if(navigator.onLine === false){ msg.textContent = 'Соединения нет'; show(false); return; }
    busy = true; btn.disabled = true; msg.textContent = 'Проверяем соединение…';
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var t = setTimeout(function(){ if(ctl) ctl.abort(); }, 6000);
    fetch(location.pathname + '?net=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function(r){ return r.status < 500; })
      .catch(function(){ return false; })
      .then(function(ok){
        clearTimeout(t); busy = false; btn.disabled = false;
        msg.textContent = ok ? '' : 'Связи пока нет';
        show(ok);
      });
  }
  btn.addEventListener('click', probe);
  window.addEventListener('online', probe);
  window.addEventListener('offline', function(){ show(false); });
  setInterval(probe, 15000);
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', probe);
  else probe();
})();
</script>
