<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест входа</title>
<style>body{font:15px/1.5 system-ui,sans-serif;background:#0F1115;color:#eee;padding:16px}button{font:inherit;padding:10px 14px;margin:4px 4px 4px 0;border-radius:8px;border:0;background:#6C5CE7;color:#fff}input{font:inherit;padding:8px;width:100%;margin:4px 0;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-all;background:#1a1d24;padding:10px;border-radius:8px}</style>
</head><body>
<h3>Тест функции auth</h3>
<input id="n" placeholder="ник (англ. буквы, 3–20)" value="testuser1">
<input id="p" placeholder="пароль" value="pass1234">
<button onclick="go('register')">Регистрация</button>
<button onclick="go('login')">Вход</button>
<pre id="o">Нажмите кнопку</pre>
<script>
const URL_='https://jutqvogqfmuhsfhrsovq.supabase.co/functions/v1/clever-function';
const KEY='sb_publishable_Xbvud1MH0bUv2gsVUpVS6Q_5z2V027z';
async function go(action){
  const o=document.getElementById('o'); o.textContent='Жду ответ…';
  try{
    const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},
      body:JSON.stringify({action:action,nick:document.getElementById('n').value,pass:document.getElementById('p').value,device:'тест'})});
    const t=await r.text();
    o.textContent='Код '+r.status+'\n'+t;
  }catch(e){ o.textContent='Нет связи: '+e.message; }
}
</script></body></html>
